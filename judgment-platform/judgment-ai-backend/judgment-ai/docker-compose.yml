services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./judgment_platform.db:/app/judgment_platform.db
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A celery_app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./judgment_platform.db:/app/judgment_platform.db
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
